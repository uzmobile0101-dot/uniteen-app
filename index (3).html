<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Uniteen Academy — Ariza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14181f);--hint:var(--tg-theme-hint-color,#6b7480);
  --card:var(--tg-theme-secondary-bg-color,#f2f4f8);--btn:var(--tg-theme-button-color,#2a6df4);--btx:var(--tg-theme-button-text-color,#fff);
  --ok:#1f9d55;--bad:#d64545;--line:rgba(127,127,127,.25)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 112px}
h1{font-size:22px;margin:4px 0 6px}h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 10px}.hint{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.row b{min-width:92px;color:var(--hint);font-weight:500}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=tel],input[type=number]{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;outline:none}
input:focus{border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;user-select:none}
.chip.on{background:var(--btn);color:var(--btx);border-color:var(--btn)}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:18px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--btn);transition:width .25s}
.opt{display:flex;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);margin:0 0 10px;cursor:pointer;background:var(--bg)}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.on{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 10%,var(--bg))}.opt.on .k{background:var(--btn);color:var(--btx)}
.q{font-size:18px;font-weight:600;margin:0 0 14px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
button.b{flex:1;padding:15px;border:0;border-radius:14px;background:var(--btn);color:var(--btx);font-size:16px;font-weight:600}
button.b[disabled]{opacity:.4}button.g{flex:0 0 auto;background:var(--card);color:var(--tx)}
.big{font-size:54px;text-align:center;margin:18px 0 6px}.c{text-align:center}
.steps{counter-reset:s;padding:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:12px;margin:10px 0}
.steps li:before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--btn);color:var(--btx);display:grid;place-items:center;font-weight:700;font-size:14px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:14px 0}.chk input{width:22px;height:22px;margin-top:2px}
</style>
</head>
<body>
<div id="app"><p class="hint c" style="margin-top:40vh">Yuklanmoqda…</p></div>
<div class="foot" id="foot" hidden><div class="in" id="foot_in"></div></div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
  var API = new URLSearchParams(location.search).get('api') || '';
  var initData = tg ? tg.initData : '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var ST = { screen: 'load', D: null, p: {}, a: [], sec: [], hid: 0, idx: 0, t0: 0, consent: false, busy: false };
  var KEY = 'uni_form_v2';   // v2: keyslar yangilandi, eski saqlangan javoblar ishlatilmasin

  function haptic(t) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ p: ST.p, a: ST.a, sec: ST.sec, hid: ST.hid, idx: ST.idx, screen: ST.screen, n: ST.D ? ST.D.cases.length : 0 })); } catch (e) {} }
  function restore() {
    try {
      var r = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (r && ST.D && r.n === ST.D.cases.length) { ST.consent = true; ST.p = r.p || {}; ST.a = r.a || []; ST.sec = r.sec || []; ST.hid = r.hid || 0; ST.idx = r.idx || 0; return r.screen; }
    } catch (e) {}
    return null;
  }
  function clearSaved() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function call(a, extra) {
    var body = JSON.stringify(Object.assign({ a: a, initData: initData }, extra || {}));
    function once() {
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow' })
        .then(function (r) { return r.json(); });
    }
    return once().catch(function (e) { ST.err = String(e && e.message ? e.message : e); return new Promise(function (r) { setTimeout(r, 1200); }).then(once); });
  }

  /* ---------- umumiy ---------- */
  function foot(html, handlers) {
    var f = $('foot');
    if (!html) { f.hidden = true; return; }
    f.hidden = false; $('foot_in').innerHTML = html;
    (handlers || []).forEach(function (h) { var el = $(h[0]); if (el) el.onclick = h[1]; });
  }
  function view(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
  function setBack(fn) {
    if (!tg || !tg.BackButton) return;
    try { tg.BackButton.offClick(setBack._f); } catch (e) {}
    if (fn) { setBack._f = fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
  }

  function fail(title, text) {
    setBack(null);
    view('<div class="big">⚠️</div><h1 class="c">' + esc(title) + '</h1><p class="c hint">' + esc(text) + '</p>');
    foot('<button class="b" id="rl">Qayta urinish</button>', [['rl', function () { location.reload(); }]]);
  }

  /* ---------- ekranlar ---------- */
  function sWelcome() {
    ST.screen = 'welcome'; setBack(null);
    view('<h1>👋 Assalomu alaykum' + (ST.D.name ? ', ' + esc(ST.D.name) : '') + '!</h1>' +
      '<p><b>' + esc(ST.D.company) + '</b> jamoasiga <b>administrator / sotuv menejeri</b> vakansiyasiga xush kelibsiz.</p>' +
      '<div class="card">' +
      '<div class="row"><b>🕗 Ish vaqti</b><span>08:30–18:00</span></div>' +
      '<div class="row"><b>💰 Maosh</b><span>6 500 000 so\'m (fix + bonus)</span></div>' +
      '<div class="row"><b>📍 Manzil</b><span>Toshkent, Yashnobod, Qorasuv-35</span></div></div>' +
      '<h2>Saralash 4 bosqich (30–35 daqiqa)</h2>' +
      '<ol class="steps"><li><div><b>Anketa va 20 ta keys</b><br><span class="hint">shu ilovada</span></div></li>' +
      '<li><div><b>5 ta savolga video javob</b><br><span class="hint">3 tilda, botda</span></div></li>' +
      '<li><div><b>To\'liq bo\'yli foto</b><br><span class="hint">botda</span></div></li>' +
      '<li><div><b>3 ta qisqa yozma savol</b><br><span class="hint">botda</span></div></li></ol>' +
      '<p class="hint">Javoblaringiz saqlanadi — ilovani yopib, keyin davom ettirishingiz mumkin.</p>');
    foot('<button class="b" id="go">Boshlash</button>', [['go', sConsent]]);
  }

  function sConsent() {
    ST.screen = 'consent'; setBack(sWelcome);
    view('<h1>🔒 Rozilik</h1><div class="card">Ism, telefon, video va foto ma\'lumotlaringiz faqat nomzodlarni saralash maqsadida ' +
      '<b>Uniteen Academy rahbariyati</b> tomonidan ko\'rib chiqiladi va uchinchi shaxslarga berilmaydi. ' +
      'Istalgan vaqtda botga <b>/ochirish</b> deb yozib, ma\'lumotlaringizni o\'chirishingiz mumkin.</div>' +
      '<label class="chk"><input type="checkbox" id="cb"' + (ST.consent ? ' checked' : '') + '><span>Shaxsiy ma\'lumotlarimni (ism, telefon, video, foto) shu maqsadda qayta ishlashga roziman</span></label>');
    var upd = function () { ST.consent = $('cb').checked; $('nx').disabled = !ST.consent; };
    foot('<button class="b" id="nx"' + (ST.consent ? '' : ' disabled') + '>Davom etish</button>', [['nx', sProfile]]);
    $('cb').onchange = upd;
  }

  var PCH = ['exp', 'eng', 'amo', 'edu', 'gs'];
  function sProfile() {
    ST.screen = 'profile'; setBack(sConsent); save();
    var h = '<h1>Tanishuv</h1>' +
      '<label class="f" for="nm">Ism va familiya</label><input type="text" id="nm" autocomplete="name" placeholder="Masalan: Aziza Karimova" value="' + esc(ST.p.name || '') + '">' +
      '<label class="f" for="ph">Telefon raqami</label><input type="tel" id="ph" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67" value="' + esc(ST.p.phone || '') + '">' +
      '<label class="f" for="ag">Yosh</label><input type="number" id="ag" inputmode="numeric" placeholder="24" value="' + esc(ST.p.age || '') + '">';
    PCH.forEach(function (k) {
      var c = ST.D.choices[k];
      h += '<label class="f">' + esc(c.q) + '</label><div class="chips" data-k="' + k + '">' +
        c.o.map(function (o) { return '<span class="chip' + (ST.p[k] === o[1] ? ' on' : '') + '" data-v="' + esc(o[1]) + '">' + esc(o[0]) + '</span>'; }).join('') + '</div>';
    });
    h += '<div class="err" id="er"></div>';
    view(h);
    Array.prototype.forEach.call(document.querySelectorAll('.chips'), function (box) {
      box.onclick = function (ev) {
        var t = ev.target.closest('.chip'); if (!t) return;
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('on'); });
        t.classList.add('on'); ST.p[box.getAttribute('data-k')] = t.getAttribute('data-v'); haptic(); save(); var er = $('er'); if (er) er.textContent = '';
      };
    });
    foot('<button class="b" id="nx">Keyslarga o\'tish →</button>', [['nx', function () {
      ST.p.name = $('nm').value.replace(/\s+/g, ' ').trim();
      ST.p.phone = $('ph').value.trim(); ST.p.age = $('ag').value.trim();
      var e = checkProfile(); $('er').textContent = e || '';
      if (e) { haptic('heavy'); return; }
      save(); ST.idx = Math.min(ST.idx, ST.D.cases.length - 1); sCase();
    }]]);
  }
  function normPhone(v) { var d = String(v).replace(/\D/g, ''); if (d.length === 9) d = '998' + d; return d.length === 12 && d.indexOf('998') === 0 ? '+' + d : ''; }
  function checkProfile() {
    var p = ST.p;
    if (p.name.length < 3 || p.name.length > 60 || !/[A-Za-zЀ-ӿʻʼ']{2,}/.test(p.name)) return 'Ism va familiyani to\'liq yozing';
    var ph = normPhone(p.phone); if (!ph) return 'Telefon raqami noto\'g\'ri. Masalan: +998 90 123 45 67';
    p.phone = ph;
    var n = parseInt(p.age, 10); if (!(n >= 16 && n <= 70)) return 'Yoshni to\'g\'ri kiriting';
    for (var i = 0; i < PCH.length; i++) if (!p[PCH[i]]) return 'Barcha savollarga javob bering';
    return '';
  }

  function sCase() {
    ST.screen = 'case'; var i = ST.idx, C = ST.D.cases[i], N = ST.D.cases.length;
    ST.t0 = Date.now(); save();
    setBack(function () { leaveCase(); if (i === 0) sProfile(); else { ST.idx = i - 1; sCase(); } });
    var L = ['A', 'B', 'C', 'D', 'E'];
    view('<div class="hint">Keys ' + (i + 1) + ' / ' + N + '</div><div class="bar"><i style="width:' + Math.round(i * 100 / N) + '%"></i></div>' +
      '<p class="q">' + esc(C.q) + '</p>' +
      C.o.map(function (o, k) { return '<div class="opt' + (ST.a[i] === o[0] ? ' on' : '') + '" data-v="' + o[0] + '"><span class="k">' + L[k] + '</span><span>' + esc(o[1]) + '</span></div>'; }).join(''));
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (el) {
      el.onclick = function () {
        Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (x) { x.classList.remove('on'); });
        el.classList.add('on'); ST.a[i] = parseInt(el.getAttribute('data-v'), 10); $('nx').disabled = false; haptic(); save();
      };
    });
    foot('<button class="b g" id="pv"' + (i === 0 ? ' hidden' : '') + '>←</button><button class="b" id="nx"' + (ST.a[i] == null ? ' disabled' : '') + '>' + (i === N - 1 ? 'Yakunlash' : 'Keyingi →') + '</button>',
      [['pv', function () { leaveCase(); ST.idx = i - 1; sCase(); }], ['nx', function () { leaveCase(); if (i === N - 1) sSubmit(); else { ST.idx = i + 1; sCase(); } }]]);
  }
  function leaveCase() { var i = ST.idx; ST.sec[i] = (ST.sec[i] || 0) + Math.round((Date.now() - ST.t0) / 1000); }

  function sSubmit() {
    ST.screen = 'submit'; setBack(null);
    view('<div class="big">⏳</div><h1 class="c">Yuborilmoqda…</h1><p class="c hint">Oynani yopmang</p>'); foot('');
    call('submit', { p: ST.p, ans: ST.a, sec: ST.sec, hid: ST.hid }).then(function (r) {
      if (r && r.ok) { clearSaved(); return r.done ? sDone('done') : r.resume ? sDone('resume') : sDone('ok'); }
      if (r && r.err === 'valid') return fail('Tekshiring', r.msg || 'Ma\'lumotda xato bor');
      if (r && r.err === 'auth') return fail('Kirish xatosi', 'Ilovani Telegramdagi bot ichidan qayta oching.');
      fail('Yuborilmadi', 'Internet yoki server xatosi. Javoblaringiz saqlangan — qayta urinib ko\'ring.');
    }).catch(function () { fail('Yuborilmadi', 'Internet yoki server xatosi. Javoblaringiz saqlangan — qayta urinib ko\'ring.'); });
  }

  function sDone(kind) {
    ST.screen = 'done'; setBack(null);
    if (kind === 'done') view('<div class="big">✅</div><h1 class="c">Ariza allaqachon topshirilgan</h1><p class="c hint">Natijalar bo\'yicha siz bilan bog\'lanamiz.</p>');
    else view('<div class="big">🎉</div><h1 class="c">' + (kind === 'resume' ? 'Anketa qabul qilingan' : 'Anketa va keyslar qabul qilindi') + '</h1>' +
      '<div class="card"><b>Endi botga qayting:</b><ol class="steps"><li><div>5 ta savolga <b>video</b> javob bering (har biri uz → ru → en tilda, ' + ST.D.video.min + '–' + ST.D.video.max + ' soniya)</div></li>' +
      '<li><div>To\'liq bo\'yli <b>foto</b> yuboring</div></li>' +
      '<li><div>3 ta qisqa <b>yozma savolga</b> javob bering</div></li></ol></div>' +
      '<p class="c hint">Bot sizga birinchi savolni allaqachon yubordi.</p>');
    foot('<button class="b" id="cl">Botga qaytish</button>', [['cl', function () { if (tg) tg.close(); else window.close(); }]]);
  }

  /* ---------- boshlash ---------- */
  document.addEventListener('visibilitychange', function () { if (document.hidden && ST.screen === 'case') { ST.hid++; save(); } });

  function start() {
    if (!API) return fail('Havola xato', 'Ilovani botdagi "📝 Anketani ochish" tugmasi orqali oching.');
    if (!initData) return fail('Telegram kerak', 'Bu ilova faqat Telegram ichida ishlaydi. Botdagi "📝 Anketani ochish" tugmasini bosing.');
    call('init').then(function (r) {
      if (!r || !r.ok) return fail('Kirish xatosi', r && r.err === 'auth' ? 'Ilovani Telegramdagi bot ichidan qayta oching.' : 'Server javob bermadi. Qayta urinib ko\'ring.');
      if (r.done) return sDone('done');
      if (r.resume) return sDone('resume');
      ST.D = r;
      var sc = restore();
      if (sc === 'case') sCase(); else if (sc === 'profile') sProfile(); else sWelcome();
    }).catch(function (e) { fail('Ulanish xatosi', 'Server javob bermadi. Sabab: ' + (e && e.message ? e.message : e) + (ST.err ? ' | 1-urinish: ' + ST.err : '')); });
  }
  start();
})();
</script>
</body>
</html>
